name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select immutable release tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw 'Release tag and application versions must match'
          }
          git checkout --detach "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag does not exist' }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version" -or $tauriVersion -ne $version -or $cargoVersion -ne $version) {
            throw 'Release tag and application versions must match'
          }
      - run: pnpm install --frozen-lockfile
      - name: Test update state
        run: node --test tests/app-update.test.cjs
      - name: Verify updater signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Add the DroidPilot signing key to the TAURI_SIGNING_PRIVATE_KEY repository secret before publishing.'
          }
      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - name: Build Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis
      - name: Prepare release assets
        shell: pwsh
        run: ./.github/scripts/prepare-release.ps1 -Tag $env:RELEASE_TAG
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-assets/*
          if-no-files-found: error
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem release-assets -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --draft --verify-tag --title "DroidPilot $env:RELEASE_TAG" --notes-file "docs/releases/$($env:RELEASE_TAG).md"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release assets uploaded but publication failed' }
