name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: darwin-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Missing TAURI_SIGNING_PRIVATE_KEY'; exit 1; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select immutable release tag
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then exit 1; fi
          git checkout --detach "refs/tags/$tag"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Verify version and embedded ADB
        run: |
          node .github/scripts/release-assets.mjs verify "$RELEASE_TAG"
          if [[ "${{ matrix.platform }}" == darwin-aarch64 ]]; then
            lipo src-tauri/binaries/macos/adb -verify_arch arm64
          fi
      - run: pnpm install --frozen-lockfile
      - name: Test update state
        run: node --test tests/app-update.test.cjs
      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib --target ${{ matrix.target }}
      - name: Build packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: '-'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Prepare platform assets
        run: node .github/scripts/release-assets.mjs stage "$RELEASE_TAG" "${{ matrix.platform }}" "src-tauri/target/${{ matrix.target }}/release"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select immutable release tag
        run: |
          tag="v$(node -p "require('./package.json').version")"
          git checkout --detach "refs/tags/$tag"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Merge updater manifest and checksums
        run: node .github/scripts/release-assets.mjs merge "$RELEASE_TAG"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --draft --verify-tag --title "DroidPilot $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          gh release edit "$RELEASE_TAG" --draft=false --latest
